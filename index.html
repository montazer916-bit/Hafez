<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Awesome Task List ✨</title>
    <link rel="stylesheet" href="face.css" />
</head>

<body>

    <!-- ═══ لایه‌های نورانی متحرک پس‌زمینه ═══ -->
    <div class="aurora">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <!-- ═══ ذرات شناور ═══ -->
    <div class="particles" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <!-- ═══ کارت اصلی ═══ -->
    <main class="card">
        <header class="card-head">
            <h1 id="title">✨ Awesome Tasks</h1>
            <p id="message">Add your tasks and watch them shine</p>
        </header>

        <form class="task-form" id="task-form">
            <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" maxlength="60" />
            <button type="submit" class="add-btn" aria-label="Add task">
                <span>+</span>
            </button>
        </form>

        <p id="error" hidden>Please enter a task!</p>

        <ul id="list">
            <li class="task">
                <span class="task-text">Learn CSS magic ✨</span>
                <button class="delete-btn" aria-label="Delete">×</button>
            </li>
            <li class="task">
                <span class="task-text">Build something awesome 🚀</span>
                <button class="delete-btn" aria-label="Delete">×</button>
            </li>
        </ul>
    </main>

    <script src="script.js"></script>
</body>

</html>
